[project]
name = "shimae-server-modpack"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
python-preference = "only-managed"

[dependency-groups]
dev = [
    "ty==0.0.108",
    "ruff>=0.17.6",
]

[tool.ruff]
src = ["scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Keep existing compact statements while checking Python errors and imports.
ignore = ["E701", "E702"]

[tool.ty.environment]
extra-paths = ["scripts"]
python-version = "3.12"

[tool.ty.src]
include = ["scripts", "tests"]
