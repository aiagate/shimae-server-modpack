name: Recover saved 0.0.2 server submission
on:
  workflow_dispatch:
    inputs:
      submit:
        description: 'One reviewed server recovery; reuse saved ZIPs and parent 9104708'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: curseforge-submit
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    environment: curseforge
    permissions:
      contents: write # exclusive recovery claim/result only
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test recovery and privacy guards
        run: python3 -m unittest discover -s tests -v
      - name: Retrieve exact saved ZIPs and original failure reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/saved"
          mkdir -p "$DEST"
          gh release download v0.0.2 --repo aiagate/shimae-server-modpack --pattern 'shimae-server-modpack-0.0.2.zip' --dir "$DEST"
          gh release download v0.0.2 --repo aiagate/shimae-server-modpack --pattern 'shimae-server-modpack-0.0.2-serverpack.zip' --dir "$DEST"
          gh run download 37883897099 --repo aiagate/shimae-server-modpack --name shimae-preflight-37883897099-1 --dir "$DEST"
          gh run download 37883897099 --repo aiagate/shimae-server-modpack --name shimae-submission-37883897099-1 --dir "$DEST"
      - name: Validate saved bytes and recover server only
        env:
          GH_TOKEN: ${{ github.token }}
          CURSEFORGE_SUBMISSION_ENABLED: ${{ vars.CURSEFORGE_SUBMISSION_ENABLED }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "$SUBMIT" == true ]]; then EXTRA+=(--submit); fi
          python3 scripts/recover_server_002.py --directory "$RUNNER_TEMP/saved" --receipt "$RUNNER_TEMP/recovery-result.json" "${EXTRA[@]}"
      - name: Save safe receipt even if recovery is uncertain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shimae-server-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-result.json
          retention-days: 14
          if-no-files-found: error
