name: CI / Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.5'
      - name: Lint and type-check Python
        run: |
          uv run --locked ruff check scripts tests
          uv run --locked ty check
      - name: Build and verify modpack
        uses: ./.github/actions/build-pack
        with:
          output-directory: ${{ runner.temp }}/build
      - name: Save reviewable generated ZIPs and receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shimae-native-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build/
          retention-days: 14
          if-no-files-found: error
