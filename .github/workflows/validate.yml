name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # verified v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q scripts tests
      - name: Keep ZIP binaries out of Git
        run: |
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          if any(p.lower().endswith(b'.zip') for p in paths):
              raise SystemExit('ZIP binaries belong in reviewed Release assets, not Git.')
          PY
      - name: Check App export input state
        id: inputs
        run: python3 scripts/verify_app_exports.py --check-state --github-output "$GITHUB_OUTPUT"
      - name: Verify the pinned public App exports without saving artifacts
        if: steps.inputs.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_app_exports.py --lock exports/exports.lock.json --policy exports/policy.json --release-config release.json --fetch --output "$RUNNER_TEMP/verified-exports" --commit "$GITHUB_SHA"
