name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # verified v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q scripts tests
      - name: Keep ZIP binaries out of Git
        run: |
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          if any(p.lower().endswith(b'.zip') for p in paths):
              raise SystemExit('ZIP binaries belong in reviewed Release assets, not Git.')
          PY
      - name: Check App export input state
        id: inputs
        run: python3 scripts/verify_app_exports.py --check-state --profile client --github-output "$GITHUB_OUTPUT"
      - name: Verify the pinned client App export without saving artifacts
        if: steps.inputs.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_app_exports.py --lock exports/exports.lock.json --policy exports/policy.json --release-config release.json --profile client --fetch --output "$RUNNER_TEMP/verified-exports" --commit "$GITHUB_SHA"
      - name: Build and check lightweight server setup offline
        if: steps.inputs.outputs.ready == 'true'
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("exports/exports.lock.json"))["version"])')
          CLIENT_NAME=$(python3 -c 'import json; print(json.load(open("exports/exports.lock.json"))["profiles"]["client"]["filename"])')
          python3 scripts/serverpack.py --client "$RUNNER_TEMP/verified-exports/$CLIENT_NAME" --output "$RUNNER_TEMP/verified-exports/shimae-server-modpack-${VERSION}-serverpack.zip" --receipt "$RUNNER_TEMP/verified-exports/server.json"
          python3 scripts/publish_pair.py --client "$RUNNER_TEMP/verified-exports/$CLIENT_NAME" --server "$RUNNER_TEMP/verified-exports/shimae-server-modpack-${VERSION}-serverpack.zip" --server-receipt "$RUNNER_TEMP/verified-exports/server.json" --receipt "$RUNNER_TEMP/verified-exports/plan.json"
