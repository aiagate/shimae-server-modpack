name: Read-only CurseForge API audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    environment: curseforge
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read game version IDs without uploading
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: python3 scripts/diagnose_api.py --receipt "$RUNNER_TEMP/api-audit.json"
      - name: Save sanitized audit receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shimae-api-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-audit.json
          retention-days: 14
          if-no-files-found: error
