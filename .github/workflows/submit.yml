name: Manual CurseForge submission

on:
  workflow_dispatch:
    inputs:
      submit:
        description: 'Submit the verified client App export to CurseForge'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: curseforge-submit
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    outputs:
      client_artifact_id: ${{ steps.client.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # verified release: v6.0.2, Node 24
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run tests and syntax checks
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q scripts tests
      - name: Fetch and verify unmodified App exports
        id: verify
        env:
          VERIFY_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_app_exports.py --lock exports/exports.lock.json --policy exports/policy.json --release-config release.json --fetch --output "$RUNNER_TEMP/verified-exports" --commit "$VERIFY_COMMIT" --github-output "$GITHUB_OUTPUT"
      - name: Validate formal client metadata and changelog before approval
        env:
          CLIENT_ZIP: ${{ steps.verify.outputs.client_zip }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release.py --zip "$CLIENT_ZIP" --receipt "$RUNNER_TEMP/verified-exports/submission-preflight.json" --commit "$GITHUB_SHA"
      - name: Save verified client App export directly
        id: client
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # verified release: v7.0.2, Node 24
        with:
          path: ${{ steps.verify.outputs.client_zip }}
          archive: false
          retention-days: 14
          if-no-files-found: error
      - name: Save verified server profile App export directly
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.verify.outputs.server_zip }}
          archive: false
          retention-days: 14
          if-no-files-found: error
      - name: Save hash and provenance report on manual main runs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shimae-export-report-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/verified-exports/SHA256SUMS
            ${{ runner.temp }}/verified-exports/receipt.json
            ${{ runner.temp }}/verified-exports/submission-preflight.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
  submit:
    needs: preflight
    if: github.ref == 'refs/heads/main' && inputs.submit
    environment: curseforge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require this run's exact verified client artifact ID
        env:
          VERIFIED_ARTIFACT_ID: ${{ needs.preflight.outputs.client_artifact_id }}
        run: '[[ "$VERIFIED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - name: Download the original ZIP without extracting it
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # verified v8.0.2, Node 24
        with:
          artifact-ids: ${{ needs.preflight.outputs.client_artifact_id }}
          path: ${{ runner.temp }}/submission-export/
          skip-decompress: true
          digest-mismatch: error
      - name: Recheck original client bytes and submission configuration
        id: recheck
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_app_exports.py --lock exports/exports.lock.json --policy exports/policy.json --release-config release.json --directory "$RUNNER_TEMP/submission-export" --profile client --github-output "$GITHUB_OUTPUT"
      - name: Submit the same verified client App export once
        env:
          CLIENT_ZIP: ${{ steps.recheck.outputs.client_zip }}
          CURSEFORGE_SUBMISSION_ENABLED: ${{ vars.CURSEFORGE_SUBMISSION_ENABLED }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CURSEFORGE_SUBMISSION_ENABLED" == true ]] || { echo 'Configure the curseforge environment before enabling submission.' >&2; exit 1; }
          python3 scripts/release.py --zip "$CLIENT_ZIP" --submit --receipt "$RUNNER_TEMP/submission.json" --commit "$GITHUB_SHA"
      - name: Keep submission receipt even when acceptance is uncertain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shimae-submission-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/submission.json
          retention-days: 14
          if-no-files-found: warn
