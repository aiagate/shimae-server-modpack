name: Manual client and server submission
on:
  workflow_dispatch:
    inputs:
      submit:
        description: 'Publish verified client and manifest-based server setup'
        type: boolean
        default: false
        required: true
      mode:
        description: 'Submit both files or only server with recorded/verified client'
        type: choice
        options: [client_server, server_only]
        default: client_server
      existing_client_file_id:
        description: 'Optional publicly approved client ID for recovery (exact bytes required)'
        type: string
        default: ''
      manual_release:
        description: 'Hold accepted files for manual publication after moderation'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: curseforge-submit
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    outputs:
      client_artifact_id: ${{ steps.client.outputs.artifact-id }}
      server_artifact_id: ${{ steps.server.outputs.artifact-id }}
      report_artifact_id: ${{ steps.report.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test validation and publication failure handling
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q scripts tests
      - name: Fetch and verify reviewed App client
        id: verify
        run: python3 scripts/verify_app_exports.py --profile client --fetch --output "$RUNNER_TEMP/verified" --commit "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Build lightweight server setup and offline publication plan
        env:
          CLIENT_ZIP: ${{ steps.verify.outputs.client_zip }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("exports/exports.lock.json"))["version"])')
          SERVER_ZIP="$RUNNER_TEMP/verified/shimae-server-modpack-${VERSION}-serverpack.zip"
          python3 scripts/serverpack.py --client "$CLIENT_ZIP" --output "$SERVER_ZIP" --receipt "$RUNNER_TEMP/verified/server.json"
          python3 scripts/publish_pair.py --client "$CLIENT_ZIP" --server "$SERVER_ZIP" --server-receipt "$RUNNER_TEMP/verified/server.json" --receipt "$RUNNER_TEMP/verified/plan.json"
      - name: Save exact client ZIP
        id: client
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.verify.outputs.client_zip }}
          archive: false
          retention-days: 14
          if-no-files-found: error
      - name: Save exact server setup ZIP
        id: server
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ runner.temp }}/verified/*-serverpack.zip
          archive: false
          retention-days: 14
          if-no-files-found: error
      - name: Save sanitized reports
        id: report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shimae-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/verified/server.json
            ${{ runner.temp }}/verified/plan.json
            ${{ runner.temp }}/verified/receipt.json
          retention-days: 14
          if-no-files-found: error
  submit:
    needs: preflight
    if: github.ref == 'refs/heads/main' && inputs.submit
    environment: curseforge
    permissions:
      contents: write # Release ZIPs + immutable submission journal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require this run's artifact IDs
        env:
          CLIENT_ID: ${{ needs.preflight.outputs.client_artifact_id }}
          SERVER_ID: ${{ needs.preflight.outputs.server_artifact_id }}
          REPORT_ID: ${{ needs.preflight.outputs.report_artifact_id }}
        run: |
          [[ "$CLIENT_ID" =~ ^[1-9][0-9]*$ && "$SERVER_ID" =~ ^[1-9][0-9]*$ && "$REPORT_ID" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.preflight.outputs.client_artifact_id }},${{ needs.preflight.outputs.server_artifact_id }}
          path: ${{ runner.temp }}/submission/
          skip-decompress: true
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.preflight.outputs.report_artifact_id }}
          path: ${{ runner.temp }}/reports/
          digest-mismatch: error
      - name: Recheck exact bytes and publish with durable duplicate prevention
        env:
          CURSEFORGE_SUBMISSION_ENABLED: ${{ vars.CURSEFORGE_SUBMISSION_ENABLED }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          EXISTING_CLIENT: ${{ inputs.existing_client_file_id }}
          MANUAL_RELEASE: ${{ inputs.manual_release }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("exports/exports.lock.json"))["version"])')
          CLIENT_NAME=$(python3 -c 'import json; print(json.load(open("exports/exports.lock.json"))["profiles"]["client"]["filename"])')
          EXTRA=()
          if [[ -n "$EXISTING_CLIENT" ]]; then
            [[ "$EXISTING_CLIENT" =~ ^[1-9][0-9]*$ ]] || exit 1
            EXTRA+=(--existing-client-file-id "$EXISTING_CLIENT")
          fi
          if [[ "$MANUAL_RELEASE" == true ]]; then EXTRA+=(--manual-release); fi
          python3 scripts/publish_pair.py --client "$RUNNER_TEMP/submission/$CLIENT_NAME" --server "$RUNNER_TEMP/submission/shimae-server-modpack-${VERSION}-serverpack.zip" --server-receipt "$RUNNER_TEMP/reports/server.json" --receipt "$RUNNER_TEMP/submission-result.json" --mode "$MODE" "${EXTRA[@]}" --submit
      - name: Preserve receipt even if acceptance is uncertain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shimae-submission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/submission-result.json
          retention-days: 14
          if-no-files-found: warn
