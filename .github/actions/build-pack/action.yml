name: Build and verify modpack
description: Test repository sources and generate verified client/server ZIPs with pinned tools
inputs:
  output-directory:
    description: Absolute path to a new output directory
    required: true
outputs:
  client_zip:
    description: Absolute path to the verified client ZIP
    value: ${{ steps.build.outputs.client_zip }}
runs:
  using: composite
  steps:
    - name: Prepare pinned NeoForge version comparison libraries
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/dep-lint-libs"
        cd "$RUNNER_TEMP/dep-lint-libs"
        curl --fail --silent --show-error --retry 2 --max-time 30 -O https://repo.maven.apache.org/maven2/org/apache/maven/maven-artifact/3.8.5/maven-artifact-3.8.5.jar
        curl --fail --silent --show-error --retry 2 --max-time 30 -O https://repo.maven.apache.org/maven2/org/apache/commons/commons-lang3/3.14.0/commons-lang3-3.14.0.jar
    - name: Test validation and publication failure handling
      shell: bash
      run: |
        export DEP_LINT_LIBS="$RUNNER_TEMP/dep-lint-libs" JAVA="$JAVA_HOME_21_X64/bin/java"
        uv run --locked python -m unittest discover -s tests -v
    - name: Lint client and server MOD dependency versions
      shell: bash
      run: uv run --locked python scripts/dependency_lint.py --libs "$RUNNER_TEMP/dep-lint-libs" --java "$JAVA_HOME_21_X64/bin/java"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27.2'
        cache: false
    - name: Build pinned standard exporter
      shell: bash
      run: GOBIN="$RUNNER_TEMP/tools" go install github.com/packwiz/packwiz@v0.0.0-20260218225342-dfd8b68a4796
    - name: Reject committed distribution binaries
      shell: bash
      run: |
        uv run --locked python - <<'PY'
        import subprocess
        paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
        if any(p.lower().endswith((b'.zip', b'.jar', b'.mrpack')) for p in paths):
            raise SystemExit('Distribution/tool binaries do not belong in Git.')
        PY
    - name: Generate and verify repository-owned client/server ZIPs
      id: build
      shell: bash
      env:
        BUILD_OUTPUT: ${{ inputs.output-directory }}
      run: |
        set -euo pipefail
        uv run --locked python scripts/build_pack.py --output "$BUILD_OUTPUT" --packwiz "$RUNNER_TEMP/tools/packwiz"
        VERSION=$(uv run --locked python -c 'import json; print(json.load(open("pack/release.json"))["version"])')
        CLIENT_ZIP="$BUILD_OUTPUT/shimae-server-modpack-${VERSION}.zip"
        SERVER_ZIP="$BUILD_OUTPUT/shimae-server-modpack-${VERSION}-serverpack.zip"
        uv run --locked python scripts/submit_pack.py --client "$CLIENT_ZIP" --client-receipt "$BUILD_OUTPUT/client.json" --server "$SERVER_ZIP" --server-receipt "$BUILD_OUTPUT/server.json" --receipt "$BUILD_OUTPUT/plan.json"
        echo "client_zip=$CLIENT_ZIP" >> "$GITHUB_OUTPUT"
