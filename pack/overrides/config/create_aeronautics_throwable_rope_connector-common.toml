[throwing]

[launcher]

[mounted]
	#Allow a rising redstone pulse to fire the Mounted Rope Launcher using its last saved aim.
	mountedRedstoneFire = true
	#Controls whether the Mounted Rope Launcher can remotely release anchors it placed.
	#REMOVE: release the rope and remove the placed connector with no refund.
	#DISABLED: remote release does nothing; players must go recover the connector manually.
	#Allowed Values: REMOVE, DISABLED
	mountedAnchorReleaseMode = "REMOVE"

[general]
	#If true, throwable connector ammo is only consumed after a successful attachment.
	#This applies to hand throws, the handheld launcher, and the mounted launcher.
	consumeOnSuccessOnly = true
	#Spawn particles at the placed connector on success.
	playParticles = true
	#Show action bar feedback when the item cannot be used.
	showFailureMessages = true

[visual]
	#Render a client-side rope-like line for thrown, handheld-launched, and mounted-launched connector projectiles.
	showProjectileRopeTrail = true
